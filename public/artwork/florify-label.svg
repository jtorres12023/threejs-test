<text x="2470" y="514">medications, or administering to children under</text>
<text x="2470" y="557">the age of 18. If you experience an adverse</text>
<text x="2470" y="600">reaction, stop use and see your doctor. Keep out</text>
<text x="2470" y="643">of reach of children. Tamper-evident inner seal;</text>
<text x="2470" y="686">if broken do not accept.</text>
